<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding invitation</title>
<meta name="theme-color" content="#2a0f0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader" role="status"><span>Preparing the entrance</span></div>

<!-- scroll track: its height drives the camera -->
<div id="track" aria-hidden="true"></div>

<main id="stage" aria-label="Scroll to walk through the temple entrance to the wedding invitation">
  <div id="viewport">
    <div id="world">

      <!-- registered with the interior: glow, couple, interior -->
      <div id="deep" class="layer">
        <div id="godrays"></div>
        <div id="glow"></div>
        <div id="couple"><img src="assets/couple.webp" alt="Shiva and Parvati seated together" draggable="false"></div>
      </div>
      <div id="interior" class="layer"><img src="assets/interior.webp" alt="Temple hall with carved pillars, garlands and brass lamps" draggable="false"></div>

      <!-- entrance -->
      <div id="facade" class="layer">
        <div id="door-spill"></div>
        <img id="wall" src="assets/facade.webp" alt="Temple entrance with carved wooden doors" draggable="false">
        <div id="door-l" class="door"><img src="assets/door-left.webp" alt="" draggable="false"></div>
        <div id="door-r" class="door"><img src="assets/door-right.webp" alt="" draggable="false"></div>
      </div>

      <!-- 3D floating golden particles volume -->
      <canvas id="particles-canvas" class="layer" width="1920" height="1080"></canvas>

      <!-- foreground entrance framing: hanging temple brass bells and marigold toran -->
      <div id="foreground" class="layer">
        <svg id="toran-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fff1c4"/>
              <stop offset="35%" stop-color="#d4982c"/>
              <stop offset="70%" stop-color="#9a6012"/>
              <stop offset="100%" stop-color="#f5d47a"/>
            </linearGradient>
            <linearGradient id="marigold-orange" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffb703"/>
              <stop offset="60%" stop-color="#fb8500"/>
              <stop offset="100%" stop-color="#d45b00"/>
            </linearGradient>
            <linearGradient id="marigold-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fff07c"/>
              <stop offset="60%" stop-color="#ffbe0b"/>
              <stop offset="100%" stop-color="#e08e00"/>
            </linearGradient>
            <linearGradient id="mango-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#588157"/>
              <stop offset="100%" stop-color="#284b25"/>
            </linearGradient>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#140602" flood-opacity="0.75"/>
            </filter>
          </defs>

          <!-- Top hanging toran garland & mango leaves -->
          <g filter="url(#shadow)">
            <!-- Main garland bar -->
            <path d="M0,0 L1920,0 L1920,18 L0,18 Z" fill="url(#brass-grad)"/>

            <!-- Scalloped marigold swag 1 -->
            <path d="M0,18 Q240,95 480,22 Q720,105 960,25 Q1200,105 1440,22 Q1680,95 1920,18" 
                  fill="none" stroke="url(#marigold-orange)" stroke-width="22" stroke-linecap="round" stroke-dasharray="1 14"/>
            <path d="M0,18 Q240,95 480,22 Q720,105 960,25 Q1200,105 1440,22 Q1680,95 1920,18" 
                  fill="none" stroke="url(#marigold-yellow)" stroke-width="14" stroke-linecap="round" stroke-dasharray="1 14"/>

            <!-- Second deeper swag -->
            <path d="M120,18 Q360,118 600,24 Q960,135 1320,24 Q1560,118 1800,18" 
                  fill="none" stroke="url(#marigold-orange)" stroke-width="18" stroke-linecap="round" stroke-dasharray="1 13"/>
            <path d="M120,18 Q360,118 600,24 Q960,135 1320,24 Q1560,118 1800,18" 
                  fill="none" stroke="url(#marigold-yellow)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 13"/>

            <!-- Auspicious Mango leaves at crests and drops -->
            <g fill="url(#mango-leaf)" stroke="#1e3a1b" stroke-width="1">
              <path d="M240,90 C232,115 235,145 240,162 C245,145 248,115 240,90 Z"/>
              <path d="M360,110 C352,135 355,165 360,182 C365,165 368,135 360,110 Z"/>
              <path d="M480,20 C472,45 475,75 480,92 C485,75 488,45 480,20 Z"/>
              <path d="M720,100 C712,125 715,155 720,172 C725,155 728,125 720,100 Z"/>
              <path d="M960,24 C952,50 955,80 960,98 C965,80 968,50 960,24 Z"/>
              <path d="M1200,100 C1192,125 1195,155 1200,172 C1205,155 1208,125 1200,100 Z"/>
              <path d="M1440,20 C1432,45 1435,75 1440,92 C1445,75 1448,45 1440,20 Z"/>
              <path d="M1560,110 C1552,135 1555,165 1560,182 C1565,165 1568,135 1560,110 Z"/>
              <path d="M1680,90 C1672,115 1675,145 1680,162 C1685,145 1688,115 1680,90 Z"/>
            </g>

            <!-- Marigold flower tassels at bottom of drops -->
            <circle cx="240" cy="98" r="14" fill="url(#marigold-orange)"/>
            <circle cx="240" cy="98" r="9" fill="url(#marigold-yellow)"/>
            <circle cx="360" cy="120" r="15" fill="url(#marigold-orange)"/>
            <circle cx="360" cy="120" r="10" fill="url(#marigold-yellow)"/>
            <circle cx="720" cy="108" r="15" fill="url(#marigold-orange)"/>
            <circle cx="720" cy="108" r="10" fill="url(#marigold-yellow)"/>
            <circle cx="960" cy="30" r="16" fill="url(#marigold-orange)"/>
            <circle cx="960" cy="30" r="11" fill="url(#marigold-yellow)"/>
            <circle cx="1200" cy="108" r="15" fill="url(#marigold-orange)"/>
            <circle cx="1200" cy="108" r="10" fill="url(#marigold-yellow)"/>
            <circle cx="1560" cy="120" r="15" fill="url(#marigold-orange)"/>
            <circle cx="1560" cy="120" r="10" fill="url(#marigold-yellow)"/>
            <circle cx="1680" cy="98" r="14" fill="url(#marigold-orange)"/>
            <circle cx="1680" cy="98" r="9" fill="url(#marigold-yellow)"/>
          </g>

          <!-- Outer vertical cascading marigold garlands (flanking screen sides) -->
          <g filter="url(#shadow)">
            <path d="M90,0 L90,750" fill="none" stroke="url(#marigold-orange)" stroke-width="20" stroke-linecap="round" stroke-dasharray="1 15"/>
            <path d="M90,0 L90,750" fill="none" stroke="url(#marigold-yellow)" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 15"/>
            <path d="M1830,0 L1830,750" fill="none" stroke="url(#marigold-orange)" stroke-width="20" stroke-linecap="round" stroke-dasharray="1 15"/>
            <path d="M1830,0 L1830,750" fill="none" stroke="url(#marigold-yellow)" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 15"/>
          </g>

          <!-- Left hanging brass bell assembly -->
          <g id="bell-assembly-l" filter="url(#shadow)">
            <!-- Brass hanging chain -->
            <path d="M310,0 L310,180" stroke="url(#brass-grad)" stroke-width="6" stroke-dasharray="12 4" stroke-linecap="round"/>
            <g id="bell-l" style="transform-origin: 310px 180px;">
              <!-- Bell cap / loop -->
              <circle cx="310" cy="184" r="9" fill="none" stroke="url(#brass-grad)" stroke-width="4"/>
              <!-- Bell body -->
              <path d="M292,204 C292,188 300,185 310,185 C320,185 328,188 328,204 C328,228 340,240 344,248 L276,248 C280,240 292,228 292,204 Z" fill="url(#brass-grad)"/>
              <!-- Bell rim -->
              <ellipse cx="310" cy="248" rx="35" ry="8" fill="url(#brass-grad)"/>
              <ellipse cx="310" cy="249" rx="27" ry="5" fill="#422206"/>
              <!-- Clapper -->
              <circle cx="310" cy="260" r="7" fill="url(#brass-grad)"/>
            </g>
          </g>

          <!-- Right hanging brass bell assembly -->
          <g id="bell-assembly-r" filter="url(#shadow)">
            <!-- Brass hanging chain -->
            <path d="M1610,0 L1610,180" stroke="url(#brass-grad)" stroke-width="6" stroke-dasharray="12 4" stroke-linecap="round"/>
            <g id="bell-r" style="transform-origin: 1610px 180px;">
              <!-- Bell cap / loop -->
              <circle cx="1610" cy="184" r="9" fill="none" stroke="url(#brass-grad)" stroke-width="4"/>
              <!-- Bell body -->
              <path d="M1592,204 C1592,188 1600,185 1610,185 C1620,185 1628,188 1628,204 C1628,228 1640,240 1644,248 L1576,248 C1580,240 1592,228 1592,204 Z" fill="url(#brass-grad)"/>
              <!-- Bell rim -->
              <ellipse cx="1610" cy="248" rx="35" ry="8" fill="url(#brass-grad)"/>
              <ellipse cx="1610" cy="249" rx="27" ry="5" fill="#422206"/>
              <!-- Clapper -->
              <circle cx="1610" cy="260" r="7" fill="url(#brass-grad)"/>
            </g>
          </g>
        </svg>
      </div>

      <div id="bloom" class="layer"></div>
    </div>
  </div>

  <div id="vignette"></div>
  <div id="scrim"></div>

  <p id="hint" class="caption"><span id="hint-text"></span><b class="line"></b></p>
  <p id="blessing" class="caption"></p>

  <section id="end" aria-live="polite">
    <p id="end-line"></p>
    <h1 id="end-names"></h1>
    <p id="end-details"></p>
  </section>

  <nav id="chapters" aria-label="Chapters"></nav>
</main>

<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
